<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aviation Material Catalog</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom scrollbar and smooth transitions */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .touch-pan-y {
      touch-action: pan-y;
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans select-none md:select-auto">

  <!-- TOP HEADER (Matching the Screenshot) -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <!-- Logo & Title -->
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i data-lucide="plane" class="w-5 h-5 -rotate-45"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Catalog</h1>
          <p class="text-[11px] font-medium text-slate-500 mt-0.5">Uçağa Çekilen Malzemeler</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <!-- Search Toggle -->
        <button id="searchToggleBtn" class="p-2.5 rounded-full hover:bg-slate-100 text-slate-600 transition active:scale-95" title="Hızlı Arama">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>

        <!-- Filter Trigger with Badge -->
        <button id="openFilterBtn" class="relative flex items-center justify-center p-2.5 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition active:scale-95 border border-blue-200/60" title="Filtrele">
          <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
          <span id="activeFilterBadge" class="hidden absolute -top-1 -right-1 bg-blue-600 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-sm">0</span>
        </button>
      </div>
    </div>

    <!-- Quick Search Bar (Collapsible or Always Accessible) -->
    <div id="quickSearchBar" class="max-w-4xl mx-auto pt-3">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="quickSearchInput" placeholder="PN, Tanım, Task Card veya Uçak ara (Örn: LENS, BRAKE, TC-JSE)..." class="w-full bg-slate-100 rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:bg-white transition border border-transparent focus:border-blue-500">

          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Active Filters Pill Bar -->
    <div id="activePillsContainer" class="hidden max-w-4xl mx-auto pt-2.5 flex flex-wrap gap-1.5 items-center">
      <span class="text-xs font-semibold text-slate-500 mr-1">Aktif:</span>
      <!-- Dynamic pills injected here -->
      <button id="clearAllPillsBtn" class="text-xs text-rose-600 hover:text-rose-700 font-medium ml-1">Tümünü Temizle</button>

  <!-- MAIN CATALOG CONTENT -->

    <div class="max-w-4xl mx-auto">
      
      <!-- Statistics / Result Info Bar -->
      <div class="flex items-center justify-between pb-3 text-xs text-slate-500 px-1 font-medium">
        <div id="resultCountText" class="flex items-center space-x-1.5">
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
          <span>Yükleniyor...</span>
        </div>
        <div class="flex items-center space-x-2">
          <span id="pageInfoText"></span>
          <button id="refreshBtn" class="p-1 hover:text-blue-600 transition" title="Yenile">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- CARDS LIST -->
      <div id="materialsList" class="space-y-3">
        <!-- Cards will be populated by JavaScript -->
      </div>

      <!-- SKELETON LOADER -->
      <div id="loadingSkeleton" class="space-y-3 pt-3">
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm animate-pulse space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-slate-200"></div>
              <div class="space-y-1.5">
                <div class="h-4 w-28 bg-slate-200 rounded"></div>
                <div class="h-3 w-20 bg-slate-100 rounded"></div>
              </div>
            </div>
            <div class="h-6 w-16 bg-slate-200 rounded-full"></div>
          </div>
          <div class="h-3.5 w-3/4 bg-slate-100 rounded"></div>
        </div>
      </div>

      <!-- EMPTY STATE -->
      <div id="emptyState" class="hidden text-center py-16 px-4 bg-white rounded-2xl border border-slate-200/80 my-4 shadow-sm">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mb-3">
          <i data-lucide="package-search" class="w-7 h-7"></i>
        </div>
        <h3 class="text-base font-bold text-slate-800">Eşleşen Malzeme Bulunamadı</h3>
        <p class="text-xs text-slate-500 mt-1.5 max-w-sm mx-auto" id="emptyStateMessage">Arama ve filtre kriterlerinize uyan kayıt bulunamadı.</p>
        <button id="resetFiltersEmptyBtn" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition shadow-sm">Filtreleri Temizle</button>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" class="hidden text-center py-12 px-4 bg-rose-50/70 border border-rose-200 rounded-2xl my-4">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mb-3">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h3 class="text-sm font-bold text-rose-800" id="errorMessageText">Bağlantı Hatası</h3>
        <p class="text-xs text-rose-600 mt-1 max-w-sm mx-auto">İstek zaman aşımına uğradı veya ağ bağlantısı kesildi.</p>
        <button id="retryBtn" class="mt-3 px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-semibold hover:bg-rose-700 transition">Tekrar Dene</button>
      </div>

      <!-- INFINITE SCROLL TRIGGER OBSERVER -->
      <div id="scrollObserver" class="h-12"></div>
    </div>
  </main>

  <!-- ============================================================== -->

    // Load Distinct Aircrafts for AC Multi-Select Chips
    async function loadAircraftList() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/distinct_aircrafts?select=*`, { headers: HEADERS });
        if (!res.ok) return;
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          const fetchedAcs = data.map(item => item.ac).filter(Boolean);
          allAircrafts = Array.from(new Set([...DEFAULT_AIRCRAFTS, ...fetchedAcs])).sort();
          const searchVal = document.getElementById('acFilterSearch') ? document.getElementById('acFilterSearch').value : '';
          renderAircraftChips(searchVal);
        }
      } catch (e) {
        console.warn('Distinct aircrafts API warning (using default list):', e);
      }
    }

    function renderAircraftChips(filterText = '') {
      const chipsContainer = document.getElementById('quickAcChips');
      if (!chipsContainer) return;
      chipsContainer.innerHTML = '';
      
      const cleanFilter = (filterText || '').trim().toLowerCase();
      const filtered = cleanFilter 
        ? allAircrafts.filter(ac => ac.toLowerCase().includes(cleanFilter))
        : allAircrafts;
      
      const label = document.getElementById('acSelectedCountLabel');
      if (label) {
        label.textContent = `${selectedAcs.size} / ${allAircrafts.length} seçildi`;

      if (filtered.length === 0) {
        chipsContainer.innerHTML = '<span class="text-xs text-slate-400 p-2 text-center w-full block">Eşleşen uçak bulunamadı.</span>';
        return;
      }

      filtered.forEach(ac => {
        const isSelected = selectedAcs.has(ac);
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = isSelected 
          ? 'px-2.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white border border-emerald-600 shadow-sm transition active:scale-95 flex items-center space-x-1 shrink-0' 
          : 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 border border-slate-200 transition active:scale-95 shadow-xs flex items-center space-x-1 shrink-0';
        
        chip.innerHTML = isSelected 
          ? `<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i><span>${ac}</span>` 
          : `<span>${ac}</span>`;

    // Build PostgREST Query URL with Lightning-Fast GIN Trigram Search
    function buildQueryUrl(offset = 0) {
      let query = `${SUPABASE_URL}/rest/v1/materials?select=*&order=created_date.desc,id.desc&limit=${PAGE_SIZE}&offset=${offset}`;

      // Global Quick Search uses single unified search_text GIN Trigram index
      if (filters.quickSearch) {
        const term = encodeURIComponent(`*${filters.quickSearch.trim()}*`);
        query += `&search_text=ilike.${term}`;
      }

      // Filter Drawer Parameters
      if (filters.pn) {
        query += `&pn=ilike.*${encodeURIComponent(filters.pn.trim())}*`;
      }
      if (filters.pn_description) {
        query += `&pn_description=ilike.*${encodeURIComponent(filters.pn_description.trim())}*`;
      }
      if (filters.ac && filters.ac.length > 0) {
        if (filters.ac.length === 1) {
          query += `&ac=eq.${encodeURIComponent(filters.ac[0])}`;
        } else {
          const list = filters.ac.map(a => encodeURIComponent(a)).join(',');
          query += `&ac=in.(${list})`;
        }
      }
      if (filters.task_card) {
        query += `&task_card=ilike.*${encodeURIComponent(filters.task_card.trim())}*`;
      }
      if (filters.task_card_desc) {
        query += `&task_card_desc=ilike.*${encodeURIComponent(filters.task_card_desc.trim())}*`;
      }
      if (filters.emp_name) {
        query += `&emp_name=ilike.*${encodeURIComponent(filters.emp_name.trim())}*`;
      }
      if (filters.date_start) {
        query += `&created_date=gte.${encodeURIComponent(filters.date_start)}T00:00:00`;
      }
      if (filters.date_end) {
        query += `&created_date=lte.${encodeURIComponent(filters.date_end)}T23:59:59`;
      }

      return query;
    }

    // Fetch Materials from Supabase
    async function fetchMaterials(reset = false) {
      if (isLoading && !reset) return;

      // Abort previous in-flight request if user triggered a new search
      if (currentAbortController) {
        currentAbortController.abort();
      }
      currentAbortController = new AbortController();

      isLoading = true;
      errorState.classList.add('hidden');

      if (reset) {
        currentOffset = 0;
        materialsData = [];
        materialsList.innerHTML = '';
        emptyState.classList.add('hidden');
        loadingSkeleton.classList.remove('hidden');
        resultCountText.innerHTML = `<div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div><span>Aranıyor...</span>`;
      }

      try {
        const url = buildQueryUrl(currentOffset);
        const res = await fetch(url, { 
          headers: HEADERS,
          signal: currentAbortController.signal 
        });
        
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        // Extract total count from Content-Range header
        const rangeHeader = res.headers.get('content-range');
        if (rangeHeader && rangeHeader.includes('/')) {
          const totalPart = rangeHeader.split('/')[1];
          totalRecords = totalPart === '*' ? 0 : (parseInt(totalPart, 10) || 0);
        }

        const data = await res.json();
        
        if (reset) {
          materialsData = data;
        } else {
          materialsData = materialsData.concat(data);
        }

        currentOffset += data.length;
        hasMore = data.length === PAGE_SIZE && currentOffset < totalRecords;

        renderCards(data, reset);
        updateStatistics();

      } catch (err) {
        // Ignore deliberate aborts from newer typing
        if (err.name === 'AbortError') {
          return;
        }
        console.error('Fetch error:', err);
        loadingSkeleton.classList.add('hidden');
        if (reset) {
          errorState.classList.remove('hidden');
          document.getElementById('errorMessageText').textContent = 'Sunucudan yanıt alınamadı';
          resultCountText.innerHTML = `<span class="text-rose-600 font-bold">Hata oluştu</span>`;
        }
      } finally {
        isLoading = false;
        loadingSkeleton.classList.add('hidden');
      }
    }

    // Clipboard Copy Helper with Visual Feedback
    async function copyToClipboard(text, btnElement) {
      if (!text || text === '-') return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
        }

        if (btnElement) {
          const originalHTML = btnElement.innerHTML;
          btnElement.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 stroke-[3]"></i>`;
          btnElement.classList.add('text-emerald-600', 'bg-emerald-50');
          lucide.createIcons();
          setTimeout(() => {
            btnElement.innerHTML = originalHTML;
            btnElement.classList.remove('text-emerald-600', 'bg-emerald-50');
            lucide.createIcons();
          }, 1500);
        }
      } catch (e) {
        console.error('Copy failed:', e);
      }
    }

      keys.forEach(k => {
        const val = document.getElementById(`filter_${k}`).value.trim();

        if (val) {
          count++;
          badge.textContent = val.length > 8 ? val.substring(0, 8) + '...' : val;
          badge.classList.remove('hidden');

          badge.classList.add('hidden');

        count++;

        badgeAc.classList.remove('hidden');

      const d2 = document.getElementById('filter_date_end').value;

        dateBadge.classList.remove('hidden');

      sheetTitleText.textContent = `Filters (${count})`;

        activeFilterBadge.textContent = count;
        activeFilterBadge.classList.remove('hidden');
      } else {

      const addPill = (label, val, onClear) => {

        pill.querySelector('button').onclick = onClear;
        activePillsContainer.appendChild(pill);

      if (filters.quickSearch) addPill('Arama', filters.quickSearch, () => { filters.quickSearch = ''; quickSearchInput.value = ''; fetchMaterials(true); updatePillsBar(); });
      if (filters.pn) addPill('PN', filters.pn, () => { filters.pn = ''; document.getElementById('filter_pn').value = ''; applyFilters(); });
      if (filters.pn_description) addPill('Tanım', filters.pn_description, () => { filters.pn_description = ''; document.getElementById('filter_pn_description').value = ''; applyFilters(); });
      if (filters.ac && filters.ac.length > 0) {
        const text = filters.ac.length === 1 
          ? filters.ac[0] 
          : `${filters.ac[0]}, ${filters.ac[1]}${filters.ac.length > 2 ? ` (+${filters.ac.length - 2})` : ''}`;
        addPill('AC', text, () => {
          filters.ac = [];
          selectedAcs.clear();
          updateAcSelectionUI();
          applyFilters();
        });
      }
      if (filters.task_card) addPill('Task Card', filters.task_card, () => { filters.task_card = ''; document.getElementById('filter_task_card').value = ''; applyFilters(); });
      if (filters.task_card_desc) addPill('TC Tanım', filters.task_card_desc, () => { filters.task_card_desc = ''; document.getElementById('filter_task_card_desc').value = ''; applyFilters(); });
      if (filters.emp_name) addPill('Personel', filters.emp_name, () => { filters.emp_name = ''; document.getElementById('filter_emp_name').value = ''; applyFilters(); });
      if (filters.date_start || filters.date_end) addPill('Tarih', `${filters.date_start || ''} - ${filters.date_end || ''}`, () => { filters.date_start = ''; filters.date_end = ''; document.getElementById('filter_date_start').value = ''; document.getElementById('filter_date_end').value = ''; applyFilters(); });

      if (hasAny) {
        const clearAll = document.createElement('button');
        clearAll.className = 'text-xs text-rose-600 hover:text-rose-700 font-semibold ml-2';
        clearAll.textContent = 'Tümünü Temizle';
        clearAll.onclick = resetFilters;
        activePillsContainer.appendChild(clearAll);
        activePillsContainer.classList.remove('hidden');
      } else {
        activePillsContainer.classList.add('hidden');
      }
    }

    // Event Listeners Setup
    function setupEventListeners() {
      // Bottom Sheet Triggers
      document.getElementById('openFilterBtn').onclick = openFilterSheet;
      document.getElementById('closeSheetBtn').onclick = closeFilterSheet;
      filterSheetBackdrop.onclick = closeFilterSheet;
      document.getElementById('sheetHeaderBar').onclick = (e) => {
        if (e.target.closest('#closeSheetBtn')) return;
        closeFilterSheet();
      };

      // Buttons
      document.getElementById('applyFiltersBtn').onclick = applyFilters;
      document.getElementById('resetFiltersBtn').onclick = resetFilters;
      document.getElementById('resetFiltersEmptyBtn').onclick = resetFilters;
      document.getElementById('retryBtn').onclick = () => fetchMaterials(true);
      document.getElementById('refreshBtn').onclick = () => fetchMaterials(true);

      // Close Detail Modal
      document.getElementById('closeDetailModal').onclick = () => document.getElementById('detailModalBackdrop').classList.add('hidden');
      document.getElementById('detailModalBackdrop').onclick = (e) => {
        if (e.target === document.getElementById('detailModalBackdrop')) {
          document.getElementById('detailModalBackdrop').classList.add('hidden');
        }
      };

      // Search Bar Toggle & Input
      const searchToggleBtn = document.getElementById('searchToggleBtn');
      searchToggleBtn.onclick = () => {
        const isHidden = quickSearchBar.classList.contains('hidden');
        if (isHidden) {
          quickSearchBar.classList.remove('hidden');
          quickSearchInput.focus();
        } else {
          quickSearchBar.classList.add('hidden');
        }
      };

      // AC Multi-select Search and Control Buttons
      const acFilterSearch = document.getElementById('acFilterSearch');
      if (acFilterSearch) {
        acFilterSearch.addEventListener('input', (e) => {
          renderAircraftChips(e.target.value.trim());
        });
      }

      const selectAllAcsBtn = document.getElementById('selectAllAcsBtn');
      if (selectAllAcsBtn) {
        selectAllAcsBtn.onclick = () => {
          allAircrafts.forEach(ac => selectedAcs.add(ac));
          updateAcSelectionUI();
        };
      }

      const clearAllAcsBtn = document.getElementById('clearAllAcsBtn');
      if (clearAllAcsBtn) {
        clearAllAcsBtn.onclick = () => {
          selectedAcs.clear();
          updateAcSelectionUI();
        };
      }

      let debounceTimer = null;
      quickSearchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const val = e.target.value.trim();
        document.getElementById('clearQuickSearch').classList.toggle('hidden', !val);

        debounceTimer = setTimeout(() => {
          filters.quickSearch = val;
          updatePillsBar();
          fetchMaterials(true);
        }, 400);
      });

      // Immediate search on Enter
      quickSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          clearTimeout(debounceTimer);
          filters.quickSearch = quickSearchInput.value.trim();
          updatePillsBar();
          fetchMaterials(true);
        }
      });

      document.getElementById('clearQuickSearch').onclick = () => {
        quickSearchInput.value = '';
        document.getElementById('clearQuickSearch').classList.add('hidden');
        filters.quickSearch = '';
        updatePillsBar();
        fetchMaterials(true);
      };

      // Infinite Scroll with IntersectionObserver
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading && hasMore) {
          fetchMaterials(false);
        }
      }, { threshold: 0.1, rootMargin: '250px' });

      observer.observe(document.getElementById('scrollObserver'));
    }
  </script>
</body>
</html>
